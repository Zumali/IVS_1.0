<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incentive Claim</title>
    <link rel="stylesheet" href="claim.css">
</head>
<body>
    <h1>Claim Your Incentives</h1>
    <form id="myForm">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="address">Address:</label>
            <input type="text" id="address" name="address" required>
        </div>
        <div class="form-group">
            <label for="city">City:</label>
            <input type="text" id="city" name="city" required>
        </div>
        <div class="form-group">
            <label for="state">State:</label>
            <input type="text" id="state" name="state" required>
        </div>
        <div class="form-group">
            <label for="zip">Zip Code:</label>
            <input type="text" id="zip" name="zip" required>
        </div>
        <div class="form-group">
            <label for="country">Country:</label>
            <input type="text" id="country" name="country" required>
        </div>
        <div class="form-group">
            <label>Book Type (Select 1):</label>
            <div class="radio-group">
                <input type="radio" id="book1" name="bookType" value="paperback">
                <label for="paperback">Paperback</label>
                <input type="radio" id="book2" name="bookType" value="ebook">
                <label for="ebook">E-Book</label>
            </div>
        </div>
        <div class="form-group">
            <label for="imageFile">Upload Image:</label>
            <input type="file" id="imageFile" name="imageFile" accept="image/*" required>
        </div>
        <button type="button" id="submitBtn" onclick="submitForm()">Submit</button>
    </form>
</body>
</html>
